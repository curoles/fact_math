- is: algebraic sign rule for multiplication
- has:
    statement:
      type: str
      value: "positive × negative = negative, negative × negative = positive"
- has:
    rationale:
      type: knowledge/rationale
      as:
        - knowledge/rationale:
            rationale_yaml:
              value: |
                euler_argument:
                  source: "Euler, Elements of Algebra, 1770"
                  observation: "a × b gives some amount"
                  reasoning: "if we reduce a by c, then (a-c) is less than a,
                    so (a-c) × b must be less than a × b"
                  conclusion: "(a-c) × b = ab - cb, the sign must be minus,
                    therefore positive × negative = negative"
                  extension: "for negative × negative, (-a) × (-b),
                    we know (-a) × b = -ab (from above),
                    reducing b makes the result less negative,
                    so (-a) × (-b) must be positive"
                formal_argument:
                  axiom: "distributive property: a(b + c) = ab + ac"
                  step_1: "a × (b + (-b)) = a × 0 = 0"
                  step_2: "a × b + a × (-b) = 0"
                  step_3: "therefore a × (-b) = -(a × b)"
                  step_4: "for (-a) × (-b): (-a)(b + (-b)) = 0,
                    (-a)b + (-a)(-b) = 0, -ab + (-a)(-b) = 0,
                    therefore (-a)(-b) = ab"
- has:
    wikipedia_url:
      type: computer/sw/url
      value: "https://en.wikipedia.org/wiki/Multiplication#Properties"
